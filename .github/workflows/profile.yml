name: Perfil e indicadores públicos

on:
  push:
    branches: [main]
    paths: ['README.md', 'scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validar indicadores sem rede
        run: python -m unittest discover -s tests -v
      - name: Reconstruir SVGs da identidade visual
        run: python scripts/build_assets.py

  update:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Atualizar somente estatísticas públicas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_metrics.py
      - name: Validar novos SVGs e cálculos
        run: python -m unittest discover -s tests -v
      - name: Publicar apenas imagens e snapshot dos indicadores
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/metrics
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração nos indicadores.'
            exit 0
          fi
          git commit -m 'chore: atualizar indicadores públicos do perfil [skip ci]'
          git push
